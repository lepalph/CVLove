name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose the template ...
        2. Switch the language to ...
    validations:
      required: true
  - type: input
    id: template
    attributes:
      label: Template and language
      description: Template id (for example moderne-2), CV language, page format.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 130 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or exported PDF
      description: Do not include personal data you want to keep private.
